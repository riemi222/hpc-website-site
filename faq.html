  .hpc-faq {
    --snow: #F0EEE8; --ice: #C8D8E4; --deep: #0B1117; --charcoal: #141C24; --slate: #1E2A36;
    --accent: #5B9EC9; --accent-bright: #7DBDE8; --rose: #D98BA0; --warm: #D4A96A; --warm-soft: #E0BD87;
    --muted: #8A99A8; --line: rgba(138,153,168,0.18);
    background: var(--deep); color: var(--snow);
    font-family: 'DM Sans','Noto Sans TC', sans-serif; font-weight:300;
    min-height: 100vh;
  }
  .hpc-faq *, .hpc-faq *::before, .hpc-faq *::after { box-sizing: border-box; }
  .hpc-faq .cjk{ font-family:'Noto Sans TC', sans-serif; }
  .hpc-faq a{ color: var(--accent-bright); }

  .hpc-faq__wrap{ max-width: 640px; margin:0 auto; padding: 0 20px 80px; }
  .hpc-faq__back{ display:inline-block; padding:20px 0 0; font-size:13px; color:var(--muted); text-decoration:none; }
  .hpc-faq__back:hover{ color:var(--accent-bright); }

  .hpc-faq__hero{ text-align:center; padding:32px 0 8px; }
  .hpc-faq__eyebrow{ font-family:'Bebas Neue', sans-serif; font-size:13px; letter-spacing:.16em; color:var(--accent-bright); display:block; margin-bottom:8px; }
  .hpc-faq__h1{ font-family:'Noto Sans TC', sans-serif; font-size:26px; font-weight:900; margin:0 0 8px; line-height:1.3; }
  .hpc-faq__intro{ font-size:14px; color:var(--muted); line-height:1.7; max-width:480px; margin:0 auto; font-family:'Noto Sans TC', sans-serif; }

  .hpc-faq__section{ padding:36px 0 0; }
  .hpc-faq__section-title{ font-size:12px; font-family:'Bebas Neue', sans-serif; letter-spacing:.12em; color:var(--muted); margin:0 0 14px; }

  .hpc-faq__list{ display:flex; flex-direction:column; gap:10px; }
  .hpc-faq__item{ background:var(--charcoal); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .hpc-faq__q{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; padding:16px 18px; font-family:'Noto Sans TC', sans-serif; font-size:14.5px; font-weight:700; color:var(--snow);
    box-sizing:border-box;
  }
  .hpc-faq__q-mark{ font-family:'Bebas Neue', sans-serif; color:var(--accent-bright); flex-shrink:0; transition:transform .2s ease; }
  .hpc-faq__item.is-open .hpc-faq__q-mark{ transform:rotate(45deg); }
  .hpc-faq__a{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .hpc-faq__item.is-open .hpc-faq__a{ max-height:1000px; }
  .hpc-faq__a-inner{ padding:0 18px 16px; font-family:'Noto Sans TC', sans-serif; font-size:13.5px; color:var(--muted); line-height:1.8; }
  .hpc-faq__a-inner ul{ margin:6px 0 0 1.1rem; padding:0; }
  .hpc-faq__a-inner li{ margin-bottom:4px; }

  .hpc-faq__contact{ background:rgba(125,189,232,0.12); border:1px solid var(--accent-bright); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--accent-bright); line-height:1.75; margin-top:20px; font-family:'Noto Sans TC', sans-serif; text-align:center; }

  @media (prefers-reduced-motion: reduce){ .hpc-faq__q-mark, .hpc-faq__a{ transition:none; } }
</style>

<body>
<div class="hpc-faq">
  <div class="hpc-faq__wrap">

    <div style="display:flex; align-items:center; justify-content:space-between; padding-top:20px;">
      <a href="index.html" style="font-family:'Bebas Neue', sans-serif; font-size:.95rem; letter-spacing:.05em; color:var(--snow); text-decoration:none;">HOKKAIDO POWDER <span style="color:var(--accent-bright);">CLUB</span></a>
      <div style="display:flex; gap:.9rem; align-items:center;"><a href="blog.html" style="color:var(--ice); font-size:.75rem; letter-spacing:.05em; text-decoration:none;">部落格</a><a href="faq.html" style="color:var(--ice); font-size:.75rem; letter-spacing:.05em; text-decoration:none;">FAQ</a><a href="faq-en.html" style="color:var(--ice); font-size:.75rem; letter-spacing:.05em; text-decoration:none;">EN</a></div>
    </div>
    <a class="hpc-faq__back" href="index.html">← 返回首頁</a>

    <div class="hpc-faq__hero">
      <span class="hpc-faq__eyebrow">FAQ</span>
      <h1 class="hpc-faq__h1 cjk">常見問題</h1>
      <p class="hpc-faq__intro cjk">點擊問題展開答案，找不到你要的答案歡迎直接聯繫我們。</p>
    </div>

    <div id="faqSections"></div>

    <div class="hpc-faq__section">
      <div class="hpc-faq__contact">找不到答案？直接透過各方案頁面底部的聯絡資訊表單告訴我們，我們會盡快回覆。</div>
    </div>

  </div>

<script>
(function () {
  // 常見問題內容：每個分類 title＝分類標題、items＝[問題, 答案]（答案可以用 HTML）
  window.FAQ_ZH = [
    { title: '方案怎麼選', items: [
      ['第一次滑雪，該選哪個方案？',
       '選<a href="camp.html">旭川5天・零基礎到連續轉彎保證班</a>。機場接送、住宿、課程、雪票、雪具雪衣、每天雪場專車全包，Day 4 學不會連續轉彎，下一季免費回來重上。'],
      ['保證班、精簡版、自由搭配差在哪？',
       '<ul><li><b>保證班</b>：5天4夜全包，含新千歲機場來回專車與贈品。</li><li><b><a href="camp-lite.html">精簡版</a></b>：跟保證班同樣的課程、住宿、雪票、雪具和雪場專車，一樣有連續轉彎保證，但不含機場接送與贈品，適合自己安排交通的人。</li><li><b><a href="custom.html">自由搭配</a></b>：機場接送、觀光包車、旭川住宿、滑雪課程、雪場接送、雪具寄存，需要什麼選什麼，適合有經驗或想客製行程的人。</li></ul>'],
      ['一個人可以報保證班嗎？',
       '可以，我們會把你和其他同程度的學員編成一班。開班前 30 天仍未達 2 人時，可以改期或全額退費。'],
      ['4 人以上可以一起報嗎？',
       '保證班和精簡版每班最多 3 人，4 人以上請直接聯絡我們，幫你安排同日期兩班。自由搭配的機場接送和包車，一台車最多 6 位。'],
    ]},
    { title: '課程與連續轉彎保證', items: [
      ['完全沒滑過可以參加嗎？',
       '可以，保證班就是為完全沒滑過的人設計的。雙板、單板都可以選，師生比最多 1:3。'],
      ['連續轉彎保證怎麼算？',
       'Day 4 最後一堂課由教練驗收並錄影：在教練指定的初級道，自己連續轉彎（單板是連續換刃）滑完全程。做不到的話，下一季免費重上 3 天課（住宿、交通、雪票、租借依當季價格另計）。<br>適用條件：10 歲以上、完全沒滑過、出席 Day 2–4 全部課程、出發前看完 3 支一分鐘暖身影片。完整內容請看<a href="camp-terms.html">報名條款</a>。'],
      ['滑過一兩次也可以報保證班嗎？',
       '可以報，課程、住宿、贈品和價格都一樣，只是不適用連續轉彎保證。'],
      ['小孩可以上課嗎？',
       '保證班和精簡版限 10 歲以上。自由搭配的滑雪課程，國小一年級以上就可以上；為了安全，也因為學習速度不同，小孩會建議和大人分開上課。'],
      ['自由搭配的課程可以在哪些雪場上？',
       '<b>北海道中部</b>：旭川、富良野、星野 TOMAMU。<br><b>北海道西部</b>：手稻、札幌國際、Onze、二世谷（Hirafu／Annupuri）、留壽都、喜樂樂（由當地合作學校授課）。兩區價格不同，選好雪場和日期後會自動算出價格。'],
      ['自由搭配的課程價格怎麼算？',
       '價格是一位教練帶一組、一天的費用，一位教練最多帶 4 位。雙板和單板要分開上課。<br>北海道中部有 3／4／6 小時三種，依人數 1:1 到 1:4 計價；北海道西部有全天 6 小時和半天 3 小時，1–2 人為基礎價，3–4 人每多 1 人 +¥5,000。旺季另有加價，系統會依日期自動計算。'],
      ['課程有包含雪票和雪具嗎？',
       '保證班和精簡版都包含 3 天雪票和全套雪具雪衣。自由搭配的滑雪課程只有教學費用，雪票和雪具需另外準備或租借。'],
    ]},
    { title: '交通與住宿', items: [
      ['保證班有機場接送嗎？',
       '有，新千歲機場 ⇄ 旭川來回專車，下飛機直接上車。精簡版不含接送，可以自己搭 JR 或巴士到旭川，第一天 14:00 入住。'],
      ['自由搭配的機場接送怎麼算？',
       '依目的地和車型計價，單程 ¥43,000 起（每台車）。1–2 位派小車 Toyota Alphard；3 位以上，或行李箱加雪板袋 5 件以上，派大車 Toyota HiAce。一台車最多 6 位，最終車型由我們確認。'],
      ['住宿是什麼樣的地方？',
       '旭川市區的日式公寓，每人一間單人房，¥11,000／人／晚（小孩同價、佔一個床位），最少住 2 晚。一間公寓最多 3 人，共用浴室、客廳和廚房；人數不是 3 的倍數時，可能會跟其他客人共用公共空間。附近有公共澡堂「菊之湯」（門票自費）。'],
      ['雪場接送怎麼安排？',
       '從旭川住處接送到神居、聖誕禮物公園、黑岳或 Pippu 滑雪場，每人每天 ¥10,000。去程 09:00 出發、回程約 16:30，回程時間依當天課程調整。'],
      ['觀光包車有哪些路線？',
       '旭川出發：旭川・旭山動物園・美瑛、富良野・美瑛。札幌出發：札幌市內、小樽、洞爺湖・登別、余市・積丹。每條路線都是 09:00 出發，依人數派小車或大車，時間依雪況和路況調整。'],
    ]},
    { title: '雪具寄存與保養', items: [
      ['需要自己帶雪具嗎？',
       '保證班和精簡版都包含全套雪具雪衣（雪板、雪靴、安全帽、雪鏡、手套、雪衣、雪褲），不用帶。只要準備保暖排汗衣、滑雪襪和脖圍。'],
      ['雪具寄存有哪些方案？',
       '<ul><li><b>溫控除濕倉儲</b>：每塊板一年 ¥16,000。</li><li><b>倉儲＋專業保養</b>：每塊板一年 ¥25,000，含封板、開板、修鋼邊與專業打蠟。</li></ul>每塊板第一次加入另收基本會員費＋出入庫手續費 ¥2,000，第二年續約用 Email 處理。'],
    ]},
    { title: '付款、價格與取消', items: [
      ['保證班和精簡版怎麼付款？',
       '填表後會收到報價信，點信裡的按鈕付訂金（每人 ¥50,000，信用卡），付完名額就確定了。點按鈕後會幫你保留名額 30 分鐘。尾款於出發前 10 天付清，出發前 30 天會寄付款連結給你；出發前 10 天內才報名的話，一次付清全額。'],
      ['自由搭配怎麼付款？',
       '送出後馬上收到估價信，我們會在 24 小時內確認日期、教練和車輛，確認後寄訂金連結（總額的 50%），付了就完成預約。'],
      ['保證班的價格會漲嗎？',
       '會。早鳥價 ¥268,000 到 11/20，11/21 起 ¥283,000，12/11 起 ¥298,000；旺季班次 ¥298,000。價格以付訂金當下為準，付了就鎖定。'],
      ['取消可以退款嗎？',
       '不論任何原因，依取消日計算：<ul><li>出發前 31 天以上：退還已付金額 50%</li><li>出發前 8–30 天：退還已付金額 30%</li><li>出發前 7 天內或未到：不退款</li></ul>退款金額會扣除 Stripe 手續費。'],
    ]},
    { title: '安全與天候', items: [
      ['雪況不好或雪場停駛怎麼辦？',
       '我們會依現場雪況、能見度和安全評估調整行程，必要時改到旭川周邊其他雪場上課，不另退款。安全永遠優先。'],
      ['有保險嗎？還需要自己買嗎？',
       '我們為上課時間投保最高 2 億日圓的意外保險（理賠條件與範圍以保險公司條款為準）。上課以外的時間，例如交通、住宿、自由活動，不在這份保險範圍內，所以請在出發前購買涵蓋滑雪／單板的旅平險。'],
    ]},
  ];

  var FAQ = window.FAQ_ZH;
  var root = document.getElementById('faqSections');
  FAQ.forEach(function (group) {
    var section = document.createElement('div');
    section.className = 'hpc-faq__section';
    var title = document.createElement('p');
    title.className = 'hpc-faq__section-title';
    title.textContent = group.title;
    var container = document.createElement('div');
    container.className = 'hpc-faq__list';
    section.appendChild(title);
    section.appendChild(container);
    root.appendChild(section);

    group.items.forEach(function (item) {
      var wrap = document.createElement('div');
      wrap.className = 'hpc-faq__item';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hpc-faq__q cjk';
      btn.innerHTML = '<span>' + item[0] + '</span><span class="hpc-faq__q-mark">+</span>';

      var aWrap = document.createElement('div');
      aWrap.className = 'hpc-faq__a';
      var aInner = document.createElement('div');
      aInner.className = 'hpc-faq__a-inner cjk';
      aInner.innerHTML = item[1];
      aWrap.appendChild(aInner);

      btn.addEventListener('click', function () {
        wrap.classList.toggle('is-open');
      });

      wrap.appendChild(btn);
      wrap.appendChild(aWrap);
      container.appendChild(wrap);
    });
  });
})();
</script>
</body>
